name: selfhost dogfood

# H9.6: CI builds the compiler with itself, not with the C++ oracle.
#
# Stage 0 is the checked-in seed (`selfhost/bootstrap/ivy-stage0.exe`), so the
# job needs no C++ compiler and no CMake: it bootstraps seed -> stage1 ->
# stage2 (F2), has stage 1 link stage 2 by itself (`--self-link`, H9.4), and
# runs the frozen golden gate (H9.3) — 1052 fixtures over all ten modes.
#
# H9.9 removed the C++ tree (`src/**`, `CMakeLists.txt`).  The parity harnesses
# that compared against it (`dogfood.ps1`, `difftest.ps1`, `interpdiff.ps1`,
# ...) remain in git history at tag `0.5-baseline`; the golden baseline
# replaces them in CI.
#
# `clang++` must be on PATH: the self-host driver resolves its linker with
# `where clang++`, and the harness links the stages with it.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  dogfood:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The full LLVM distribution is a ~900 MB download; the extracted tree is
      # much bigger, so caching it is what keeps the job from spending most of
      # its time on the network.  Bump the `-v1` suffix when the archive layout
      # or the DIA patch below changes.
      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: C:\LLVM
          key: llvm-21.1.6-full-${{ runner.os }}-v1

      - name: Install LLVM
        run: |
          # The LLVM preinstalled on windows-latest (the choco `llvm` package,
          # i.e. the official `LLVM-<ver>-win64.exe`) ships only the command
          # line tools: no headers, no libraries, no `llvm-config` and no CMake
          # package (actions/runner-images#12565).  The full distribution is the
          # `clang+llvm` archive, which is what `selfhost/build.ps1` links
          # against (`llvm-config --libs x86 --system-libs`).
          # The version must match the LLVM the sources are written against
          # (`Module::setTargetTriple(Triple)` exists in 21.x, not in 20.x).
          $ver = "21.1.6"
          $root = "C:\LLVM"
          $name = "clang+llvm-$ver-x86_64-pc-windows-msvc"
          $prefix = Join-Path $root $name
          function Test-FullLlvm([string]$p) {
            if (-not $p) { return $false }
            return (Test-Path "$p\bin\clang.exe") -and
                   (Test-Path "$p\bin\clang++.exe") -and
                   (Test-Path "$p\bin\llvm-config.exe") -and
                   (Test-Path "$p\lib\cmake\llvm\LLVMConfig.cmake")
          }
          if (-not (Test-FullLlvm $prefix)) {
            $archive = Join-Path $env:RUNNER_TEMP "$name.tar.xz"
            curl.exe -L --fail --retry 3 -o $archive `
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/$name.tar.xz"
            if ($LASTEXITCODE -ne 0) { throw "LLVM download failed" }
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            tar.exe -xf $archive -C $root
            if ($LASTEXITCODE -ne 0) { throw "LLVM extraction failed" }
          }
          if (-not (Test-FullLlvm $prefix)) {
            throw "full LLVM is not usable at $prefix"
          }
          # LLVM's Windows package bakes the DIA SDK path of the machine that
          # built it (`.../Visual Studio/2019/Professional/DIA SDK/...`) into
          # LLVMExports.cmake.  This workflow does not use CMake any more, but
          # the patch is cheap and keeps the cached tree usable by older
          # harnesses.  It must be idempotent: on a cache hit the file already
          # points at this runner's DIA SDK.
          $exports = Join-Path $prefix "lib\cmake\llvm\LLVMExports.cmake"
          $text = Get-Content -LiteralPath $exports -Raw
          if ($text -match 'DIA SDK/lib/amd64/diaguids\.lib') {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            $dia = $null
            foreach ($inst in (& $vswhere -all -products * -property installationPath)) {
              $candidate = Join-Path $inst.Trim() "DIA SDK\lib\amd64\diaguids.lib"
              if (Test-Path -LiteralPath $candidate) { $dia = $candidate; break }
            }
            if (-not $dia) { throw "DIA SDK (diaguids.lib) not found" }
            $dia = $dia -replace '\\', '/'
            $patched = [regex]::Replace($text,
              '(?i)[A-Z]:/[^";]*?DIA SDK/lib/amd64/diaguids\.lib', $dia)
            if ($patched -ne $text) {
              Set-Content -LiteralPath $exports -Value $patched -NoNewline
              "patched DIA SDK path: $dia"
            } else {
              "DIA SDK path already points at $dia"
            }
          } else {
            "LLVMExports.cmake has no DIA SDK reference"
          }
          # `clang++` (the driver's linker and the stage link) and `llvm-config`
          # both rely on PATH; LLVM_ROOT is what the harnesses auto-detect.
          # IVY_LINKER pins the driver to *this* LLVM: windows-latest also has
          # the choco `llvm` on PATH and its clang++ must not link the stages
          # against 21.1.6 libraries.  (The golden gate folds the path to
          # `<CLANG>`, so the exact location is irrelevant.)
          Add-Content -Path $env:GITHUB_PATH -Value "$prefix\bin"
          "LLVM_ROOT=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "IVY_LINKER=$prefix\bin\clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$prefix\bin\llvm-config.exe" --version

      - name: Bootstrap without the oracle (F2 + self-link + golden)
        run: |
          # Seed hash -> stage 1 -> stage 2 with byte-identical objects, `.ivm`,
          # `rt.obj` and executables; then stage 1 links the same objects by
          # itself; finally the golden gate over the frozen baseline.
          pwsh -NoProfile -File selfhost\build.ps1 `
            -LlvmRoot "$env:LLVM_ROOT" `
            -TempRoot "$env:RUNNER_TEMP\h96" `
            -SelfLink -Golden

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-logs
          # `*.err` holds stderr, `*.out` holds stdout (the MSVC linker writes
          # its unresolved-symbol lines to stdout).
          path: |
            ${{ runner.temp }}/h96/**/*.err
            ${{ runner.temp }}/h96/**/*.out
          if-no-files-found: ignore
